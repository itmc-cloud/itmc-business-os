name: Release to Google Play

# See docs/PUBLISHING.md for the one-time manual setup this workflow depends on
# (service account, Play Console API access, signing key, repo secrets). None
# of that can be done from CI — it's a prerequisite, not something this file sets up.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: "internal: build+upload fresh. production: promote the build already on internal (no rebuild — this is what you want after testing internal). production-fresh-build: build+upload a new binary straight to production, skipping internal entirely (needs pubspec.yaml's build number bumped first)."
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - production
          - production-fresh-build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode signing key and write key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # storeFile below is relative to android/app/ (that's where Gradle's
          # file() resolves it from in app/build.gradle.kts), so the keystore
          # must be decoded into android/app/, not android/.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Write Play Console service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > fastlane/play-service-account.json

      - run: flutter pub get

      - name: Deploy (internal track, on tag push)
        if: github.event_name == 'push'
        run: bundle exec fastlane android deploy_internal

      - name: Deploy (manual track selection)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.track == 'internal'
        run: bundle exec fastlane android deploy_internal

      - name: Promote internal build to production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.track == 'production'
        run: bundle exec fastlane android promote_production

      - name: Deploy fresh build directly to production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.track == 'production-fresh-build'
        run: bundle exec fastlane android deploy_production
