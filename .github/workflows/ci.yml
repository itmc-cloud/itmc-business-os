name: CI

# Quality gate for ongoing development — separate from release.yml, which
# only runs on version tags (v*.*.*) regardless of branch. This workflow
# runs on every push to dev and every PR targeting main, so problems are
# caught before a merge to main, not after tagging a release.

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
